services:
  web:
    build: .
    image: meal-subsidy-bounds:latest
    ports:
      # Publish both the conventional Flask port and port 8000.
      - "8000:8000"
      - "5000:8000"
    environment:
      DATABASE_PATH: /data/subsidy.db
    volumes:
      - subsidy-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  subsidy-data:
